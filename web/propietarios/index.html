<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app usa toda la pantalla del móvil, también bajo la muesca -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1F24" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet" />
    <!-- Leaflet pinta los mapas; jsQR lee el código QR en las imágenes de la cámara. Dos librerías de JavaScript
         normal, sin npm: el navegador las descarga de unpkg y crean las variables globales L y jsQR -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <title>TapeaCompostela para locales</title>
  </head>
  <body>
    <!-- js/app.js pinta aquí la pantalla que toque: entrar, tus locales... Lo que se abre encima (un local, el alta,
         el escáner) se añade al final del body -->
    <div id="root"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
