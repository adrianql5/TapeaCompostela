services:
  postgres:
    image: 'postgres:latest'

    container_name: 'tapeacompostela-db'

    environment:
      - 'POSTGRES_DB=tapeacompostela'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql'
volumes:
  pgdata: