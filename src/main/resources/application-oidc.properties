# Perfil "oidc": los tokens los emite Keycloak, no /auth/login. Spring lee
# http://localhost:8180/realms/tapeacompostela/.well-known/openid-configuration y saca las claves públicas de ahí
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/tapeacompostela

# El nombre del usuario (authentication.getName()) sale de este claim. Keycloak pone en "sub" un id como "3f21...",
# y nuestros usuarios se buscan por su username, que Keycloak pone en "preferred_username"
app.jwt.principal-claim=preferred_username