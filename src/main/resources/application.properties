spring.application.name=tapeacompostela
spring.datasource.url=jdbc:postgresql://localhost:5432/tapeacompostela
spring.datasource.username=postgres
spring.datasource.password=postgres

# Las tablas se crean de las entidades cada vez que la app
# se reinicia por lo que todos los datos se pierden
spring.jpa.hibernate.ddl-auto=create

# Enseña cada sentencia SQL que Hibernate ejecuta
spring.jpa.show-sql=true

# Los scripts de resources/sql que llenan las tablas con datos
# de prueba después de que Hibernate haya creado las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/01_users.sql,classpath:sql/02_businesses.sql,classpath:sql/03_reviews.sql,classpath:sql/04_rewards.sql

# Los errores de Spring MVC también se responden como ProblemDetail (RFC 9457)
spring.mvc.problemdetails.enabled=true


# Con @JsonView, los campos que no tienen vista también se escriben. Sin esta opción, los campos de Page
# (content, totalElements...) desaparecerían de GET /businesses, que respondería {}
spring.jackson.mapper.default-view-inclusion=true

# Clave secreta que firma el JWT. Al menos 32 caracteres (256 bits, el mínimo para HS256)
app.jwt.secret=tapeacompostela-secret-key-for-development-only-0123456789

# Cuánto tiempo se puede usar un código de canje, y cada cuánto busca la tarea los caducados (duraciones ISO-8601: P30D son
# 30 días, PT1H una hora)
app.redemptions.validity=P30D
app.redemptions.check-interval=PT1H

# Versionado de API: el cliente pide una versión con la cabecera "API-Version: 2.0". Sin ella, 1.0
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.0

# Cachés de @Cacheable, en memoria con Caffeine: 500 elementos como mucho, cada uno durante 10 minutos
spring.cache.type=caffeine
spring.cache.cache-names=tags
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m