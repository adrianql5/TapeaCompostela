spring.application.name=tapeacompostela
spring.datasource.url=jdbc:postgresql://localhost:5432/tapeacompostela
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath*:sql/*.sql

# Image files: committed seed images in static/images, uploads in ./uploads/images (not in git).
# Both are served under /images/..., and that path is what the *_url columns store.
spring.web.resources.static-locations=classpath:/static/,file:uploads/
